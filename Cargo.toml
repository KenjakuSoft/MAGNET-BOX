[package]
name = "magnetbox"
version = "0.1.3"
edition = "2021"
description = "Self-hosted magnet/torrent → direct HTTP download & streaming, in one Rust binary. Built on librqbit."

[dependencies]
librqbit = "9"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tokio-util = { version = "0.7.12", features = ["io"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
anyhow = "1.0.80"
argon2 = { version = "0.5", features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3.30"
sysinfo = "0.35"
url = "2.5"
totp-rs = { version = "5.7", default-features = false, features = ["otpauth"] }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
sha2 = "0.10.8"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }

[profile.release]
opt-level = 2
